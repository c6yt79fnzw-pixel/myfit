<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c2d"><title>MyFit</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#0b1421;color:#f5f8fc}*{box-sizing:border-box}body{margin:0;max-width:600px;margin:auto;padding:20px 16px 100px}h1{font-size:27px;margin:12px 0}h2{font-size:19px}.muted{color:#a9bacb}.card{background:#18283c;border:1px solid #304259;border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(130deg,#173d61,#18283c)}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#2078ed;color:white;font-weight:650;cursor:pointer}button.secondary{background:#30445e}button.green{background:#16a66b;color:white;width:100%}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#101d2d;border-top:1px solid #3a4d60;padding:10px 5px max(12px,env(safe-area-inset-bottom))}.tabs button{flex:1;max-width:140px;background:transparent;font-size:12px;padding:8px 2px}.tabs button.active{color:#61b0ff;background:#1a3454}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{color:#83dcb4}.metric{display:inline-block;width:48%;padding:10px}.metric b{font-size:22px}.task{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #33475c}.task input{width:22px;height:22px;accent-color:#2bd48a}.field{display:block;width:100%;background:#0e1a2b;color:white;border:1px solid #53667d;border-radius:9px;padding:11px;margin:7px 0 13px}label{font-size:14px;color:#c9d8e8}.hide{display:none}.day{padding:12px 0;border-bottom:1px solid #31445b}.tiny{font-size:12px}.bar{height:10px;background:#34455b;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#24c87e}svg{width:100%;height:170px}.legend{color:#9fb1c7;font-size:12px}.task{align-items:flex-start}.task input{flex-shrink:0}.exercise-image{display:block;width:100%;height:auto;max-width:320px;margin:10px 0 0;background:#101d2d;border:1px solid #33475c;border-radius:10px}.exercise-image text{fill:#c9d8e8;font-size:10px;text-anchor:middle}</style></head><body><header class="row"><div><div class="pill">● DEINE FITNESS-APP</div><h1>MyFit 💪</h1></div><span>🏋️</span></header><main id="content"></main><nav class="tabs" id="tabs"></nav><script>
const key='military-fit-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db.sessions??={};db.metrics??=[];db.start??='2026-11-12';db.height??=187;let tab='Start',training='A',tick={},running=null,seconds=0;
const A = [
  ["Liegestütze", "2 × 8", "Hände etwa schulterbreit aufsetzen, Körper gerade halten und kontrolliert absenken."],
  ["Kniebeugen", "2 × 12", "Hüfte nach hinten führen, Fersen am Boden lassen und Knie in Richtung der Fußspitzen bewegen."],
  ["Ausfallschritte rückwärts", "2 × 8 je Bein", "Einen Schritt zurück machen, beide Knie beugen und dich über den vorderen Fuß wieder aufrichten."],
  ["Unterarmstütz (Plank)", "2 × 25 Sekunden", "Ellbogen unter den Schultern, Körper in einer Linie halten und ruhig weiteratmen."]
];
const B = [
  ["Ausfallschritte rückwärts", "2 × 8 je Bein", "Hände an die Hüften legen. Einen Schritt zurück machen und dich über den vorderen Fuß wieder aufrichten."],
  ["Beckenheben (Glute Bridge)", "2 × 10", "Auf den Rücken legen, Füße aufstellen und Arme ruhig neben dem Körper lassen. Becken anheben und langsam absenken."],
  ["Liegestütze", "2 × 7–8", "Körper gerade halten und kontrolliert absenken. Bei Bedarf die Hände auf einer stabilen Erhöhung abstützen."],
  ["Seitstütz", "2 × 15–20 Sekunden je Seite", "Ellbogen unter die Schulter setzen und Becken anheben. Für die leichtere Variante die Knie am Boden lassen."]
];

const exercisePoses = {
  'Liegestütze': [
    ['Oben', [81,26], 'M74 39 L51 48 L26 61 L15 70 M74 39 L76 55 L78 70'],
    ['Unten', [84,44], 'M76 56 L51 60 L26 64 L15 70 M76 56 L63 62 L79 70'],
  ],
  'Kniebeugen': [
    ['Oben', [70,12], 'M69 25 L66 44 L67 57 L66 70 L78 70 M69 25 L76 33 L87 34'],
    ['Unten', [72,24], 'M68 35 L49 53 L79 52 L69 70 L81 70 M68 35 L83 38 L99 38'],
  ],
  'Ausfallschritte rückwärts': [
    ['Stand', [66,12], 'M65 25 L64 44 L66 56 L65 70 L76 70 M65 25 L73 37 L65 43'],
    ['Schritt zurück', [66,23], 'M64 35 L63 51 L87 52 L87 70 L98 70 M63 51 L48 65 L26 67 L23 70 M64 35 L73 43 L64 50'],
  ],
  'Unterarmstütz (Plank)': [
    ['Halten', [83,35], 'M74 46 L51 52 L28 60 L17 70 M74 46 L73 69 L94 69'],
  ],
  'Beckenheben (Glute Bridge)': [
    ['Becken unten', [21,61], 'M34 68 L61 68 L77 47 L91 69 L103 69 M39 67 L54 70 L64 70'],
    ['Becken oben', [21,61], 'M34 68 L58 50 L76 40 L91 69 L103 69 M38 65 L52 70 L64 70'],
  ],
  'Seitstütz': [
    ['Beine gestreckt', [30,26], 'M37 39 L58 51 L85 62 L102 70 M37 39 L32 69 L14 69 M37 39 L51 39 L58 51'],
    ['Knie am Boden', [30,26], 'M37 39 L56 49 L75 69 L101 69 M37 39 L32 69 L14 69 M37 39 L50 39 L56 49'],
  ],
};

function exerciseImage(name) {
  const poses = exercisePoses[name];
  if (!poses) return '';
  const width = 112 * poses.length;
  const panels = poses.map(([label, [headX, headY], limbs], index) => {
    return `<g transform="translate(${112 * index} 0)">
      <path d="M8 73 H104" stroke="#51667a"/>
      <path d="${limbs}" fill="none" stroke="#83dcb4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${headX}" cy="${headY}" r="6.5" fill="#83dcb4"/>
      <text x="56" y="89">${label}</text>
    </g>`;
  }).join('');
  return `<svg class="exercise-image" viewBox="0 0 ${width} 96" role="img" aria-label="${esc(name)}: ${poses.map(([label]) => label).join(', ')}" style="max-width:${poses.length === 1 ? 160 : 320}px">${panels}</svg>`;
}

const today=()=>new Date().toLocaleDateString('sv-SE');const dateDE=s=>new Date(s+'T12:00:00').toLocaleDateString('de-DE');const save=()=>localStorage.setItem(key,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(x)=>Number(x)||0;function view(t){tab=t;render()}function render(){document.getElementById('tabs').innerHTML=['Start','Training','Fortschritt','Kalender','Mehr'].map(x=>`<button class="${x===tab?'active':''}" onclick="view('${x}')">${({Start:'⌂',Training:'▣',Fortschritt:'▥',Kalender:'▦',Mehr:'⚙'})[x]}<br>${x}</button>`).join('');const el=document.getElementById('content');if(tab==='Start'){let count=Object.values(db.sessions).filter(s=>s.type==='Training').length;let mins=Object.values(db.sessions).reduce((a,s)=>a+num(s.minutes),0);let last=db.metrics.at(-1);el.innerHTML=`<section class="card hero"><div class="muted">28-Tage-Challenge · ab ${dateDE(db.start)}</div><h2>Heute zählt dein Einsatz!</h2><div class="row"><strong>${count} Trainingstage</strong><strong>${mins} Minuten gesamt</strong></div><p class="muted">15 Minuten Trampolin + 15 Minuten Krafttraining</p><button class="green" onclick="view('Training')">Training öffnen →</button></section><div class="card"><h2>Deine letzten Körperwerte</h2>${last?`<div class="metric">Gewicht<br><b>${esc(last.weight||'–')} kg</b></div><div class="metric">BMI<br><b>${last.weight?(num(last.weight)/(db.height/100)**2).toFixed(1):'–'}</b></div><div class="metric">Muskelmasse<br><b>${esc(last.muscle||'–')} kg</b></div><div class="metric">Bauchumfang<br><b>${esc(last.waist||'–')} cm</b></div>`:'Noch keine Messung gespeichert.'}<button onclick="view('Fortschritt')">Messung erfassen</button></div><div class="card"><h2>Heute</h2>${db.sessions[today()]?`Gespeichert: ${esc(db.sessions[today()].type)} (${num(db.sessions[today()].minutes)} Min.)`:'Noch kein Eintrag.'}<p><button class="secondary" onclick="markRest()">🎺 Musikprobe / Pause</button></p></div>`}else if(tab==='Training'){el.innerHTML=`<div class="card"><h2>Training ${training}</h2><div class="row"><button onclick="training='A';tick={};render()">Training A</button><button onclick="training='B';tick={};render()">Training B</button></div><p class="muted">Zwei Sätze pro Übung · ca. 45–60 Sek. Satzpause</p><h3>Trampolin: 15 Minuten ohne Hanteln</h3><div class="row"><span id="timer">${fmt(seconds)}</span><button onclick="timerToggle()">${running?'Stoppen':'Timer starten'}</button><button class="secondary" onclick="timerReset()">Reset</button></div><h3>Krafttraining: ca. 15 Minuten</h3>${(training==='A'?A:B).map((e,i)=>`<div class="task"><input type="checkbox" ${tick[i]?'checked':''} onchange="tick[${i}]=this.checked"><div><strong>${e[0]}</strong><div class="pill tiny">${e[1]}</div><p class="muted tiny">${e[2]}</p>${exerciseImage(e[0])}</div></div>`).join('')}<label>Gesamte Trainingsdauer (Minuten)<input id="duration" class="field" type="number" min="0" value="30"></label><button class="green" onclick="saveWorkout()">Training speichern ✓</button></div>`}else if(tab==='Fortschritt'){let last=db.metrics.at(-1);el.innerHTML=`<div class="card"><h2>Neue Körpermessung</h2><label>Datum<input class="field" type="date" id="mdate" value="${today()}"></label>${[['weight','Gewicht (kg)'],['fat','Körperfett (%)'],['muscle','Muskelmasse (kg)'],['waist','Bauchumfang (cm)']].map(([k,l])=>`<label>${l}<input class="field" id="${k}" type="number" step="0.1" placeholder="Optional"></label>`).join('')}<button class="green" onclick="saveMetric()">Messung speichern</button></div><div class="card"><h2>Gewichtsverlauf</h2>${chart()}<p class="legend">BMI wird aus Gewicht und Körpergröße (${db.height} cm) berechnet.</p></div><div class="card"><h2>Messhistorie</h2>${[...db.metrics].reverse().map(m=>`<div class="day"><b>${dateDE(m.date)}</b> · ${esc(m.weight||'–')} kg · Fett ${esc(m.fat||'–')} % · Muskel ${esc(m.muscle||'–')} kg · Bauch ${esc(m.waist||'–')} cm</div>`).join('')||'Noch keine Werte.'}</div>`}else if(tab==='Kalender'){let days=Array.from({length:28},(_,i)=>{let d=new Date(db.start+'T12:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('sv-SE')});el.innerHTML=`<div class="card"><h2>28-Tage-Übersicht</h2><p class="muted">Tippe auf einen Tag, um Training oder Pause zu erfassen.</p>${days.map((d,i)=>{let s=db.sessions[d];return `<div class="day row"><div><strong>Tag ${i+1} · ${dateDE(d)}</strong><div class="muted tiny">${s?esc(s.type)+(s.minutes?' · '+s.minutes+' Min.':''):'Noch kein Eintrag'}</div></div><select onchange="setDay('${d}',this.value)"><option value="">–</option><option ${s?.type==='Training'?'selected':''}>Training</option><option ${s?.type==='Musikprobe'?'selected':''}>Musikprobe</option><option ${s?.type==='Ruhetag'?'selected':''}>Ruhetag</option></select></div>`}).join('')}</div>`}else{el.innerHTML=`<div class="card"><h2>Einstellungen</h2><label>Körpergröße (cm)<input id="height" class="field" type="number" value="${db.height}"></label><label>Startdatum der Challenge<input id="start" class="field" type="date" value="${db.start}"></label><button onclick="db.height=num(document.getElementById('height').value);db.start=document.getElementById('start').value;save();render();alert('Gespeichert')">Speichern</button></div><div class="card"><h2>Datensicherung</h2><p class="muted">Alle Einträge bleiben auf diesem Gerät. Exportiere regelmäßig ein Backup.</p><button onclick="backup()">JSON-Backup exportieren</button><label>Backup importieren<input class="field" type="file" accept="application/json" onchange="restore(this.files[0])"></label></div><div class="card"><h2>Erinnerung</h2><p>18:00 Uhr – deine bestehende ChatGPT-Erinnerung. Diese lokale Vorschau sendet keine eigenen Push-Mitteilungen.</p></div>`}}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function timerToggle(){if(running){clearInterval(running);running=null}else{running=setInterval(()=>{seconds++;let t=document.getElementById('timer');if(t)t.textContent=fmt(seconds)},1000)}render()}function timerReset(){if(running)clearInterval(running);running=null;seconds=0;render()}function saveWorkout(){db.sessions[today()]={type:'Training',plan:training,minutes:num(document.getElementById('duration').value),checks:{...tick}};save();alert('Training gespeichert!');view('Start')}function markRest(){db.sessions[today()]={type:'Musikprobe',minutes:0};save();render()}function setDay(d,v){if(!v)delete db.sessions[d];else db.sessions[d]={type:v,minutes:v==='Training'?30:0};save();render()}function saveMetric(){let m={date:document.getElementById('mdate').value};for(let k of ['weight','fat','muscle','waist'])m[k]=document.getElementById(k).value;db.metrics=db.metrics.filter(x=>x.date!==m.date).concat(m).sort((a,b)=>a.date.localeCompare(b.date));save();render()}function chart(){let arr=db.metrics.filter(x=>num(x.weight)>0);if(!arr.length)return '<p class="muted">Noch keine Gewichtsdaten vorhanden.</p>';let vals=arr.map(x=>num(x.weight)),lo=Math.min(...vals)-1,hi=Math.max(...vals)+1,pts=vals.map((v,i)=>`${20+i*300/Math.max(1,vals.length-1)},${145-(v-lo)/(hi-lo)*120}`).join(' ');return `<svg viewBox="0 0 340 170" role="img" aria-label="Gewichtsverlauf"><line x1="20" y1="145" x2="320" y2="145" stroke="#61758d"/><polyline points="${pts}" fill="none" stroke="#54b4ff" stroke-width="3"/>${vals.map((v,i)=>`<circle cx="${20+i*300/Math.max(1,vals.length-1)}" cy="${145-(v-lo)/(hi-lo)*120}" r="4" fill="#46d5a5"/>`).join('')}</svg><div class="legend">${dateDE(arr[0].date)} bis ${dateDE(arr.at(-1).date)}</div>`}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='myfit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!d.sessions||!Array.isArray(d.metrics))throw Error('Ungültiges Format');if(confirm('Aktuelle Daten durch das Backup ersetzen?')){db=d;save();render()}}catch(e){alert('Import fehlgeschlagen: '+e.message)}}render();
</script></body></html>
